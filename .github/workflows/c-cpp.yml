name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install x11, xrandr, pango, cairo, xvfb, xdotool and xprop
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libpango1.0-dev libcairo2-dev xvfb xdotool x11-utils fonts-dejavu-core
    - name: make -j8
      run: make -j8
    - name: make check
      run: make check
